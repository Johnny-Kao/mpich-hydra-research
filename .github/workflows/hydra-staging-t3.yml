name: MPICH Hydra Staging T3 - exact HEAD verification
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpich-hydra-staging-t3
  cancel-in-progress: false

jobs:
  staging-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mpich
        shell: bash
    steps:
      - name: Checkout exact Staging HEAD
        uses: actions/checkout@v4
        with:
          repository: Johnny-Kao/mpich
          ref: 2b4596da5b3e79bc063c989d0517fc7bf1cfa1ee
          path: mpich
          fetch-depth: 5
          submodules: recursive
          persist-credentials: false

      - name: Checkout standalone fault-test harness (test assets only)
        uses: actions/checkout@v4
        with:
          repository: Johnny-Kao/mpich-hydra-research
          ref: ef85882b3b0a1bce53dc0d5c0711b82d6fe15410
          path: harness
          sparse-checkout: research/hydra/pmi_lifecycle.c
          persist-credentials: false

      - name: Verify precise upstream base, source allowlist, and whitespace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2b4596da5b3e79bc063c989d0517fc7bf1cfa1ee
          git cat-file -e 623ce38a4e9c37a52cb901db6befaa89a9819586^{commit}
          test "$(git merge-base HEAD 623ce38a4e9c37a52cb901db6befaa89a9819586)" = 623ce38a4e9c37a52cb901db6befaa89a9819586
          git diff --check 623ce38a4e9c37a52cb901db6befaa89a9819586 HEAD
          git diff --name-only 623ce38a4e9c37a52cb901db6befaa89a9819586 HEAD | tee /tmp/hydra-changed.txt
          while IFS= read -r file; do
            case "$file" in
              src/pm/hydra/proxy/pmip_pmi.c|src/pm/hydra/proxy/pmip_pmi.h|src/pm/hydra/proxy/pmip_cb.c|test/mpi/impls/pmi/test_pmi2_nodeattr.c|test/mpi/impls/pmi/Makefile.am|test/mpi/impls/pmi/testlist) ;;
              *) echo "::error::Out-of-scope file: $file"; exit 1 ;;
            esac
          done < /tmp/hydra-changed.txt
          ! grep -R -n 'HYDRA_RESEARCH_QUEUE_TRACE\|PMI_RESEARCH_DIR' src/pm/hydra/proxy
          echo 'STAGING_HEAD_ALLOWLIST_AND_DIFF=PASS'

      - name: Install build prerequisites
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config gfortran python3 libhwloc-dev libnuma-dev

      - name: Bootstrap / configure MPICH with Hydra
        run: |
          ./autogen.sh > "$GITHUB_WORKSPACE/evidence/autogen.log" 2>&1 || { tail -n 100 "$GITHUB_WORKSPACE/evidence/autogen.log"; exit 1; }
          ./configure --prefix="$RUNNER_TEMP/mpich" --with-pm=hydra \
            --with-device=ch4:ofi --with-libfabric=embedded \
            --with-yaksa=embedded --with-mpl=embedded \
            --with-hwloc=embedded --disable-fortran --disable-cxx \
            --disable-doc --disable-dependency-tracking \
            > "$GITHUB_WORKSPACE/evidence/configure.log" 2>&1 || { tail -n 100 "$GITHUB_WORKSPACE/evidence/configure.log"; exit 1; }

      - name: Build PMI and MPL and test harness before full build
        run: |
          make -C src/mpl -j 2 > "$GITHUB_WORKSPACE/evidence/mpl.log" 2>&1 || { tail -n 80 "$GITHUB_WORKSPACE/evidence/mpl.log"; exit 1; }
          make -C src/pmi -j 2 > "$GITHUB_WORKSPACE/evidence/pmi.log" 2>&1 || { tail -n 80 "$GITHUB_WORKSPACE/evidence/pmi.log"; exit 1; }
          for testname in test_pmi1 test_pmi2 test_pmi2_nodeattr; do
            ./libtool --mode=link gcc -std=c11 -O1 -g -Wall -Wextra -Wno-unused-parameter \
              -Isrc/pmi/include "test/mpi/impls/pmi/${testname}.c" \
              src/pmi/libpmi.la src/mpl/libmpl.la -ldl -lm \
              -o "./${testname}" \
              > "$GITHUB_WORKSPACE/evidence/${testname}-link.log" 2>&1 || {
                tail -n 100 "$GITHUB_WORKSPACE/evidence/${testname}-link.log"
                exit 1
              }
            test -x "./${testname}"
          done
          ./libtool --mode=link gcc -std=c11 -O1 -g -Wall -Wextra -Werror -pthread \
            -Isrc/pmi/include ../harness/research/hydra/pmi_lifecycle.c \
            src/pmi/libpmi.la src/mpl/libmpl.la -ldl -lm \
            -o ./hydra-fault-harness \
            > "$GITHUB_WORKSPACE/evidence/fault-harness-link.log" 2>&1 || {
              tail -n 100 "$GITHUB_WORKSPACE/evidence/fault-harness-link.log"
              exit 1
            }

      - name: Build and install exact Staging MPICH
        run: |
          make -j 2 > "$GITHUB_WORKSPACE/evidence/build.log" 2>&1 || { tail -n 100 "$GITHUB_WORKSPACE/evidence/build.log"; exit 1; }
          make install > "$GITHUB_WORKSPACE/evidence/install.log" 2>&1 || { tail -n 100 "$GITHUB_WORKSPACE/evidence/install.log"; exit 1; }

      - name: Run all 3 native PMI tests (PMI1, PMI2, multi-waiter)
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/mpich/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/mpich/lib:${LD_LIBRARY_PATH:-}"
          for spec in 'test_pmi1 2' 'test_pmi2 2' 'test_pmi2_nodeattr 4'; do
            read -r testname ranks <<< "$spec"
            timeout -k 3s 40s mpiexec -n "$ranks" "./${testname}" \
              2>&1 | tee "$GITHUB_WORKSPACE/evidence/${testname}.log"
            grep -q 'No Errors' "$GITHUB_WORKSPACE/evidence/${testname}.log"
            echo "NATIVE_${testname}=PASS"
          done

      - name: Direct PMI2 control and fault cases (non-instrumented Staging build)
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/mpich/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/mpich/lib:${LD_LIBRARY_PATH:-}"
          export PMI_RESEARCH_DIR="$(mktemp -d)"
          timeout -k 3s 30s mpiexec -n 2 ./hydra-fault-harness control \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/control.log"
          grep -q 'CONTROL_GET rc=0 found=1 value=ready' "$GITHUB_WORKSPACE/evidence/control.log"
          for mode in fault-no-wait fault fault-two-waiters; do
            for attempt in 1 2 3; do
              export PMI_RESEARCH_DIR="$(mktemp -d)"
              log="$GITHUB_WORKSPACE/evidence/${mode}-${attempt}.log"
              set +e
              timeout -k 3s 30s mpiexec -disable-auto-cleanup -n 3 \
                ./hydra-fault-harness "$mode" > "$log" 2>&1
              result=$?
              set -e
              cat "$log"
              echo "mpiexec_status=$result" | tee -a "$log"
              test "$result" -ne 124 && test "$result" -ne 255
              grep -q '^KILL_WAITER pid=' "$log"
              grep -q 'FAULT_PUT_DONE rc=0' "$log"
              if [ "$mode" = fault-two-waiters ]; then
                grep -q 'SURVIVING_WAITER_GET rc=0 found=1 value=ready' "$log"
                grep -q 'SURVIVING_WAITER_DONE rc=0' "$log"
              else
                grep -q 'SURVIVOR_DONE rc=0' "$log"
              fi
              if grep -q 'Bad file descriptor' "$log"; then
                echo "::error::Stale PMI socket write"; exit 1
              fi
              echo "STAGING_${mode}_${attempt}=PASS"
            done
          done

      - name: Preserve T3 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-staging-t3-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: ignore
